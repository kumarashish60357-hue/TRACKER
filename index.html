<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker</title>
<style>
body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
.card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
h2 { margin-bottom: 5px; color: #333; }
p { color: #666; font-size: 14px; margin-bottom: 20px; }
input { width: 90%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
button { width: 96%; padding: 10px; background-color: #0044ff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
button:hover { background-color: #0033cc; }
.toggle-btn { background: none; color: #0044ff; border: none; margin-top: 15px; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>

<div class="card">
<h2 id="form-title">Login</h2>
<p>Tracker App</p>

<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>

<button id="main-btn">Login</button>
<button class="toggle-btn" id="toggle-btn">Need an account? Register</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyBilxSDUUVefx01qC8hSA5geDqP7VKpVGw",
authDomain: "tracker-9e0b3.firebaseapp.com",
projectId: "tracker-9e0b3",
storageBucket: "tracker-9e0b3.firebasestorage.app",
messagingSenderId: "542021217929",
appId: "1:542021217929:web:28c3a446b74fea61ff6058",
measurementId: "G-45ZB88V7LE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isLogin = true;

const formTitle = document.getElementById("form-title");
const mainBtn = document.getElementById("main-btn");
const toggleBtn = document.getElementById("toggle-btn");

toggleBtn.addEventListener("click", () => {
isLogin = !isLogin;
if (isLogin) {
formTitle.innerText = "Login";
mainBtn.innerText = "Login";
toggleBtn.innerText = "Need an account? Register";
} else {
formTitle.innerText = "Register";
mainBtn.innerText = "Register";
toggleBtn.innerText = "Already have an account? Login";
}
});

mainBtn.addEventListener("click", () => {
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

if (!email || !password) {
alert("Please fill in all fields.");
return;
}

if (isLogin) {
signInWithEmailAndPassword(auth, email, password)
.then((userCredential) => {
alert("Login Successful! Welcome: " + userCredential.user.email);
})
.catch((error) => {
alert("Login Error: " + error.message);
});
} else {
createUserWithEmailAndPassword(auth, email, password)
.then((userCredential) => {
alert("Account Created Successfully! You can now login.");
})
.catch((error) => {
alert("Registration Error: " + error.message);
});
}
});
</script>

</body>
</html>
